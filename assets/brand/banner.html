<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; background: transparent; }
  body { font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .banner {
    position: relative; width: 1280px; height: 400px; border-radius: 28px; overflow: hidden;
    background: linear-gradient(120deg, #FFF0F5 0%, #FDF6FB 42%, #EAF6FE 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .blob.pink { width: 380px; height: 380px; left: -90px; top: -150px; background: #FFB3CB; }
  .blob.blue { width: 460px; height: 460px; right: -120px; bottom: -220px; background: #9ED9FA; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(30,42,68,.07) 1.2px, transparent 1.2px); background-size: 22px 22px; mask-image: linear-gradient(90deg, transparent 0%, #000 55%, transparent 100%); }

  .left { position: absolute; left: 76px; top: 0; bottom: 0; display: flex; align-items: center; gap: 30px; }
  .icon { width: 132px; height: 132px; filter: drop-shadow(0 14px 26px rgba(54,120,190,.28)); flex: none; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .text { display: flex; flex-direction: column; gap: 10px; }
  .title { font-size: 60px; font-weight: 800; letter-spacing: 2px; color: #1E2A44; line-height: 1.05; }
  .pkg { font: 600 22px/1 "Cascadia Code", "JetBrains Mono", Consolas, monospace; color: #5A6A86; letter-spacing: .5px; }
  .tagline { margin-top: 6px; font-size: 23px; color: #33415C; font-weight: 500; }
  .chips { display: flex; gap: 10px; margin-top: 10px; }
  .chip { font-size: 15px; font-weight: 600; padding: 6px 13px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid rgba(30,42,68,.08); color: #3B4A66; box-shadow: 0 2px 6px rgba(30,42,68,.05); }
  .chip.pink { color: #E2557F; } .chip.blue { color: #1C8FCB; }

  .card { position: absolute; right: 74px; top: 62px; width: 432px; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: 0 22px 50px rgba(40,70,120,.16), 0 2px 6px rgba(40,70,120,.06); transform: rotate(-2.2deg); }
  .card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: #5A6A86; font-weight: 600; }
  .card-h i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .f { position: relative; aspect-ratio: 16/10; border-radius: 9px; overflow: hidden; }
  .f .n { position: absolute; left: 6px; top: 5px; font: 700 11px/1 Consolas, monospace; color: #fff; background: rgba(0,0,0,.35); padding: 3px 5px; border-radius: 5px; }
  .f .t { position: absolute; right: 6px; bottom: 5px; font: 600 10px/1 Consolas, monospace; color: #fff; background: rgba(0,0,0,.35); padding: 3px 5px; border-radius: 5px; }
  .f1 { background: linear-gradient(180deg,#8FD3FF,#D8F1FF 60%,#9BD67E 60%,#6FBF5A); }
  .f1::after { content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#FFD86B; left:62%; top:16%; box-shadow:0 0 0 6px rgba(255,216,107,.35); }
  .f2 { background: linear-gradient(135deg,#2B2F55,#5B3F8C); }
  .f2::after { content:""; position:absolute; left:18%; right:18%; bottom:22%; height:34%; border-radius:6px 6px 0 0; background:linear-gradient(90deg,#FF8DB0,#FFC2D4); }
  .f3 { background: radial-gradient(circle at 50% 120%, #FFB36B, #FF7E9A 45%, #7A5CC9 100%); }
  .f4 { background: linear-gradient(160deg,#E9F6FF,#BFE3FA); }
  .f4::after { content:""; position:absolute; width:40%; height:56%; left:30%; top:22%; border-radius:50% 50% 12px 12px; background:#36B3F0; opacity:.8; }
  .f5 { background: linear-gradient(180deg,#14213D,#2E4A7D); }
  .f5::after { content:"★"; position:absolute; left:50%; top:50%; transform:translate(-50%,-55%); font-size:30px; color:#FFE38A; }
  .f6 { background: linear-gradient(135deg,#FFE3EC,#FFC9DA); }
  .f6::after { content:""; position:absolute; left:22%; right:22%; top:30%; bottom:30%; border-radius:10px; border:3px solid #E2557F; }
  .sub { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .line { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #33415C; }
  .line b { font: 600 11px/1 Consolas, monospace; color: #1C8FCB; flex: none; }
  .bar { height: 7px; border-radius: 4px; background: #EEF2F7; flex: 1; position: relative; overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }

  .dm { position: absolute; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #fff; box-shadow: 0 8px 20px rgba(30,42,68,.12); white-space: nowrap; }
  .dm1 { right: 452px; top: 40px; color: #E2557F; transform: rotate(-4deg); }
  .dm2 { right: 40px; top: 312px; color: #1C8FCB; transform: rotate(3deg); }
  .dm3 { right: 446px; top: 262px; color: #7A5CC9; transform: rotate(-2deg); }
</style>
</head>
<body>
<div class="banner">
  <div class="blob pink"></div><div class="blob blue"></div><div class="dots"></div>

  <div class="left">
    <div class="icon"><!-- ICON --></div>
    <div class="text">
      <div class="title">B站伙伴</div>
      <div class="pkg">dsh-bili-eyes</div>
      <div class="tagline">让 AI 真的看懂 B站视频，也能自己逛 B站</div>
      <div class="chips">
        <span class="chip pink">分镜图</span><span class="chip blue">台词</span><span class="chip">热评 · 弹幕</span><span class="chip pink">自己逛</span><span class="chip blue">QQ 机器人</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><i style="background:#FF8DB0"></i><i style="background:#FFD86B"></i><i style="background:#36B3F0"></i><span style="margin-left:6px">分镜 1 / 2 · 每格约 1 分钟</span></div>
    <div class="grid">
      <div class="f f1"><span class="n">1</span><span class="t">00:00</span></div>
      <div class="f f2"><span class="n">2</span><span class="t">01:02</span></div>
      <div class="f f3"><span class="n">3</span><span class="t">02:05</span></div>
      <div class="f f4"><span class="n">4</span><span class="t">03:11</span></div>
      <div class="f f5"><span class="n">5</span><span class="t">04:20</span></div>
      <div class="f f6"><span class="n">6</span><span class="t">05:34</span></div>
    </div>
    <div class="sub">
      <div class="line"><b>[02]</b><span>这里转场好顺，配乐也卡点了</span></div>
    </div>
  </div>

  <div class="dm dm1">名场面来了</div>
  <div class="dm dm2">这期讲得真清楚</div>
  <div class="dm dm3">前方高能</div>
</div>
</body>
</html>
